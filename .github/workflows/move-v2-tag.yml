name: Move v2 tag

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  move-v2-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: move-v2-tag
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - name: Read active major
        id: major
        run: |
          major="$(cat .github/workflow-major)"
          case "$major" in
            v2|v3) ;;
            *) echo "workflow-major must contain an allowed major (v2 or v3), got: $major" >&2; exit 1 ;;
          esac
          echo "major=$major" >> "$GITHUB_OUTPUT"

      - name: Check the tag already exists
        run: |
          if ! git ls-remote --tags origin "refs/tags/${{ steps.major.outputs.major }}" | grep -q .; then
            echo "tag ${{ steps.major.outputs.major }} does not exist yet, refusing to create it" >&2
            exit 1
          fi

      - name: Move the tag
        id: move
        run: |
          current="$(git ls-remote --tags origin "refs/tags/${{ steps.major.outputs.major }}" | cut -f1)"
          if [ "$current" = "$GITHUB_SHA" ]; then
            echo "Tag ${{ steps.major.outputs.major }} already points at $GITHUB_SHA, nothing to do."
            echo "moved=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git tag -f "${{ steps.major.outputs.major }}" "$GITHUB_SHA"
          git push -f origin "refs/tags/${{ steps.major.outputs.major }}"
          echo "moved=true" >> "$GITHUB_OUTPUT"

      - name: Verify the tag
        if: steps.move.outputs.moved == 'true'
        run: |
          moved="$(git ls-remote --tags origin "refs/tags/${{ steps.major.outputs.major }}" | cut -f1)"
          if [ "$moved" != "$GITHUB_SHA" ]; then
            echo "tag ${{ steps.major.outputs.major }} did not move to $GITHUB_SHA, got $moved" >&2
            exit 1
          fi
          echo "Tag ${{ steps.major.outputs.major }} now points at $GITHUB_SHA."
