name: PR Agent Review (reusable)
# Shared AI code review for every repo in the org. Lives in hothsys/.github at
# .github/workflows/reusable-pr-agent.yml; each repo calls it from a small
# pr-agent.yml, the same caller pattern as the lint and PR Summary workflows.
#
# Review-only (no auto describe/improve) and free OpenRouter models only, to
# stay within the free-tier request budget shared with the PR Summary
# workflow. Same model policy as the frayme pilot: the openrouter/free router
# picks an available free model and the empty fallback list blocks any
# paid-model fallback.
#
# Token-saving skip: when every changed file in a PR is docs or repo config
# (a README, the docs/ folder, or the .github/ folder), the review step is
# skipped and no OpenRouter request is made. A PR that mixes code with docs
# or config is still reviewed in full.
#
# Callers use pull_request (not pull_request_target), so GitHub itself
# withholds secrets and write access from fork PRs, and the job guard below
# skips bot-authored and fork PRs explicitly.
on:
  workflow_call:
    secrets:
      OPENROUTER_API_KEY:
        required: true

jobs:
  review:
    # Skip bot-authored PRs (e.g. dependabot) and fork PRs (no secrets,
    # read-only token); collaborator branches from ordinary user accounts pass.
    if: ${{ github.event.sender.type != 'Bot' && github.event.pull_request.head.repo.fork == false }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Check for reviewable files
        id: check
        # Pinned to a commit (v9.0.0), same as reusable-pr-summary.yml.
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const { owner, repo } = context.repo;
            const prNumber = context.payload.pull_request.number;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number: prNumber, per_page: 100,
            });
            // A PR is skipped only when EVERY changed file is docs or repo
            // config; mixed code+docs PRs are still reviewed in full.
            const isExcluded = (name) =>
              /(^|\/)readme(\.[^/]+)?$/i.test(name) ||
              name.startsWith('docs/') ||
              name.startsWith('.github/');
            const skipped = files.filter(f => isExcluded(f.filename)).length;
            const reviewable = files.length > 0 && skipped < files.length;
            core.info(`${files.length} changed file(s), ${skipped} of them docs/config-only`);
            core.info(reviewable ? 'PR has reviewable files' : 'Docs/config-only PR, skipping AI review');
            core.setOutput('reviewable', reviewable ? 'true' : 'false');
      - name: Run PR-Agent review
        if: steps.check.outputs.reviewable == 'true'
        # Pinned to the v0.50.0 commit because this step reads the OpenRouter
        # secret (same pinning practice as reusable-pr-summary.yml).
        uses: the-pr-agent/pr-agent@e673a02076ce09a4726c3d0c3cc85780e59ca52b
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Same OpenRouter key the PR Summary workflow uses.
          OPENROUTER__KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Free models only: the openrouter/free router picks an available free
          # model, and the empty fallback list blocks any paid-model fallback.
          CONFIG.MODEL: "openrouter/free"
          CONFIG.FALLBACK_MODELS: "[]"
          GITHUB_ACTION_CONFIG.AUTO_REVIEW: "true"
          GITHUB_ACTION_CONFIG.AUTO_DESCRIBE: "false"
          GITHUB_ACTION_CONFIG.AUTO_IMPROVE: "false"
          # No labels on agent-authored PRs; disable PR-Agent's review labels
          # (security + effort).
          PR_REVIEWER.ENABLE_REVIEW_LABELS_SECURITY: "false"
          PR_REVIEWER.ENABLE_REVIEW_LABELS_EFFORT: "false"
