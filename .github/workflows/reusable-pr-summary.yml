name: PR Summary (reusable)
# Shared AI PR summary for every repo in the org. Lives in <org>/.github at
# .github/workflows/reusable-pr-summary.yml; each repo calls it from a small
# pr-summary.yml
#
# Callers use pull_request (not pull_request_target) so GitHub itself withholds
# secrets and write access from fork PRs. Dependabot runs read secrets from the
# Dependabot store, so OPENROUTER_API_KEY must be set there as well as under
# Actions (org-level secrets work for both).
#
# This workflow sees the caller's event and repository, so the script below
# summarizes the PR in the calling repo.
#
# Models: an ordered fallback list of OpenRouter model IDs, tried in turn by
# OpenRouter itself (its `models` array falls back on any error: rate limits,
# downtime, moderation, pricing). Spend is pinned to $0: the script drops any
# entry that is not a `:free` variant or the openrouter/free router, so a
# misconfigured variable can never route to a paid model. If every model in
# the list fails, the run skips the PR comment entirely (no placeholder).
on:
  workflow_call:
    inputs:
      models:
        description: 'Comma-separated ordered OpenRouter model IDs (free only); overrides the OPENROUTER_MODELS variable'
        type: string
        required: false
        default: ''
      model:
        description: 'Deprecated single-model override; use models instead'
        type: string
        required: false
        default: ''
    secrets:
      OPENROUTER_API_KEY:
        required: true
jobs:
  summary:
    # Skip fork PRs: they get no secrets and a read-only token, so the run
    # would only fail. Summarize them by hand through workflow_dispatch.
    #
    # Skip agent-authored PRs: they already carry a full human-written
    # description, so the AI summary is redundant. A PR counts as
    # agent-authored when it has any label in the exclude list below, or its
    # author login is in the author exclude list (GitHub expressions have no
    # any(), so each excluded label gets its own contains()). Extend these
    # lists as new agent identities appear.
    # workflow_dispatch still runs on them as the manual escape hatch when a
    # summary is wanted anyway.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.pull_request.head.repo.full_name == github.repository &&
        !contains(github.event.pull_request.labels.*.name, 'instinct-agent') &&
        !contains(github.event.pull_request.labels.*.name, 'ai-agent') &&
        !contains(github.event.pull_request.labels.*.name, 'mindphaser') &&
        !contains(github.event.pull_request.labels.*.name, 'mindfazer') &&
        !contains(fromJSON('["instinct-agent", "instinctagent", "instinct-agent[bot]", "mindphaser", "mindphaser[bot]", "mindfazer"]'), github.event.pull_request.user.login)
      )
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Generate PR Summary
        # Pinned to a commit (v9.0.0) because this job can read secrets
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Model list: the caller's `models` (or deprecated `model`) input,
          # else the OPENROUTER_MODELS / OPENROUTER_MODEL configuration
          # variable (Settings > Secrets and variables > Actions > Variables),
          # else the built-in default below. Comma-separated, tried in order;
          # openrouter/free (the free-models router) should stay last.
          OPENROUTER_MODELS: ${{ inputs.models || inputs.model || vars.OPENROUTER_MODELS || vars.OPENROUTER_MODEL || 'nvidia/nemotron-3-ultra-550b-a55b:free,google/gemma-4-31b-it:free,openrouter/free' }}
        with:
          script: |
            const { owner, repo } = context.repo;

            let prNumber;
            if (context.payload.pull_request) {
              prNumber = context.payload.pull_request.number;
            } else if (context.payload.inputs && context.payload.inputs.pr_number) {
              prNumber = parseInt(context.payload.inputs.pr_number, 10);
            }

            if (!prNumber || isNaN(prNumber)) {
              throw new Error("Could not determine a valid Pull Request number!");
            }

            core.info(`Summarizing ${owner}/${repo}#${prNumber} (event: ${context.eventName}, actor: ${context.actor})`);

            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
            const commits = await github.paginate(github.rest.pulls.listCommits, {
              owner, repo, pull_number: prNumber, per_page: 100,
            });
            const { data: files } = await github.rest.pulls.listFiles({
              owner, repo, pull_number: prNumber, per_page: 100,
            });

            const skipDirs = ['.github/', '.circleci/', '.gitlab/'];
            const appFiles = files.filter(f => !skipDirs.some(d => f.filename.startsWith(d)));
            const diffParts = (appFiles.length ? appFiles : files).slice(0, 12).map(f => {
              const patch = (f.patch || '').slice(0, 1500);
              return `--- ${f.filename} (${f.status}, +${f.additions}/-${f.deletions})\n${patch}`;
            });
            const diffContext = diffParts.join('\n\n');
            const commitList = commits
              .map(c => c.commit.message.split('\n')[0].trim())
              .filter(m => m && !m.startsWith('Merge'))
              .join('\n');

            core.info(`PR by ${pr.user.login}: ${pr.changed_files} files changed, ${commits.length} commits`);
            core.info(`Prompt input: ${diffParts.length} file diffs, ${diffContext.length} characters`);

            // Ordered fallback list. Free models only: anything that is not a
            // `:free` variant or the openrouter/free router is dropped so the
            // spend stays $0 no matter what the variable contains.
            const DEFAULT_MODELS = [
              'nvidia/nemotron-3-ultra-550b-a55b:free',
              'google/gemma-4-31b-it:free',
              'openrouter/free',
            ];
            const isFree = m => m === 'openrouter/free' || m.endsWith(':free');
            const requested = (process.env.OPENROUTER_MODELS || '')
              .split(',').map(s => s.trim()).filter(Boolean);
            const dropped = requested.filter(m => !isFree(m));
            if (dropped.length) {
              core.warning(`Ignoring non-free models, spend must stay $0: ${dropped.join(', ')}`);
            }
            const modelList = requested.filter(isFree);
            const models = modelList.length ? modelList : DEFAULT_MODELS;
            const run = { requestedModels: models, usedModel: null, provider: null, status: null, attempts: 0 };
            core.info(`Model fallback list (in order): ${models.join(' -> ')}`);

            let aiSummary = '';
            try {
              const targetEndpoint = 'https://openrouter.ai/api/v1/chat/completions';

              const headers = {
                'Authorization': `Bearer ${process.env.OPENROUTER_API_KEY}`,
                'Content-Type': 'application/json',
                'HTTP-Referer': 'https://github.com',
                'X-Title': 'GitHub PR Summarizer'
              };
              const baseRequest = {
                  // OpenRouter tries `model` first, then walks `models` in
                  // order on any error (rate limit, downtime, moderation,
                  // pricing), and answers with the model that succeeded.
                  model: models[0],
                  models,
                  messages: [
                    {
                      role: 'system',
                      content: 'You are a senior software engineer summarizing a pull request for the team. Write 2-4 sentences describing what this PR changes from the USER\'S perspective: what they will see or experience differently. Lead with the most important behavioral change, not implementation details. Do not describe internal mechanisms (caching, classes, event handlers) unless they ARE the feature. Do not use markdown headers or bullet points. Write in third person ("This PR adds..." not "I added..."). Be specific: name the features and UI elements affected. Never end with filler like "aims to improve," "enhances the experience," "improves usability," or any sentence that could apply to any PR. After stating the facts, stop.'
                    },
                    { role: 'user', content: `PR Title: ${pr.title}\n\nCommit messages:\n${commitList}\n\nDiff:\n${diffContext}` }
                  ],
                  temperature: 0.2,
                  // max_tokens covers reasoning AND the visible answer; if a reasoning
                  // model spends it all thinking, content comes back empty.
                  max_tokens: 2000,
                  // Ask OpenRouter to report the cost of this request in `usage`.
                  usage: { include: true },
              };

              // Some models reject reasoning settings (HTTP 400), so ask for
              // low effort and, on a reasoning-related 400, retry without the
              // setting. Models without reasoning ignore it.
              const post = async (body, label) => {
                run.attempts += 1;
                const started = Date.now();
                const resp = await fetch(targetEndpoint, {
                  method: 'POST', headers, body: JSON.stringify(body),
                });
                const text = await resp.text();
                run.status = resp.status;
                core.info(`OpenRouter attempt ${run.attempts} (${label}): HTTP ${resp.status} in ${Date.now() - started} ms`);
                return { resp, text };
              };

              let aiResp, rawBody;
              for (const extra of [{ reasoning: { effort: 'low' } }, {}]) {
                ({ resp: aiResp, text: rawBody } = await post(
                  { ...baseRequest, ...extra },
                  extra.reasoning ? 'reasoning effort low' : 'no reasoning setting'
                ));
                if (!(aiResp.status === 400 && /reasoning/i.test(rawBody) && extra.reasoning)) break;
                core.info('Model rejected the reasoning setting; retrying without it.');
              }

              if (aiResp.ok) {
                const aiData = JSON.parse(rawBody);
                const choice = aiData.choices?.[0];
                aiSummary = (choice?.message?.content || '').trim();
                const usage = aiData.usage || {};
                run.usedModel = aiData.model || null;
                run.provider = aiData.provider || null;
                run.finishReason = choice?.finish_reason ?? null;
                run.promptTokens = usage.prompt_tokens ?? null;
                run.completionTokens = usage.completion_tokens ?? null;
                run.reasoningTokens = usage.completion_tokens_details?.reasoning_tokens ?? 0;
                run.cost = usage.cost ?? null;
                run.generationId = aiData.id || null;

                core.info(`Model used: ${run.usedModel}${run.provider ? ` via ${run.provider}` : ''}`);
                core.info(`Finish reason: ${run.finishReason}; tokens: prompt ${run.promptTokens}, completion ${run.completionTokens} (reasoning ${run.reasoningTokens})`);
                if (run.cost !== null) core.info(`Cost: $${run.cost}`);
                if (run.generationId) core.info(`OpenRouter generation ID: ${run.generationId}`);
                if (!aiSummary) {
                  core.warning(`AI summary was empty (finish_reason ${run.finishReason}).` +
                    (aiData.error ? ` ${JSON.stringify(aiData.error)}` : ''));
                }
              } else {
                // Every model in the fallback list failed.
                core.warning(`AI summary failed on the whole fallback list (last HTTP ${aiResp.status}): ${rawBody.slice(0, 1000)}`);
              }
            } catch (e) {
              core.warning(`AI summary JavaScript error: ${e.stack || e.message}`);
            }

            const writeRunSummary = async (outcome) => {
              const table = await core.summary
                .addHeading(`PR summary for #${prNumber}`, 3)
                .addTable([
                  [{ data: 'Field', header: true }, { data: 'Value', header: true }],
                  ['Requested models', run.requestedModels.join(', ')],
                  ['Model used', run.usedModel || 'none (no AI summary)'],
                  ['Provider', run.provider || 'unknown'],
                  ['HTTP status', String(run.status ?? 'no response')],
                  ['Attempts', String(run.attempts)],
                  ['Finish reason', String(run.finishReason ?? 'n/a')],
                  ['Tokens (prompt / completion / reasoning)',
                    `${run.promptTokens ?? '?'} / ${run.completionTokens ?? '?'} / ${run.reasoningTokens ?? '?'}`],
                  ['Cost (USD)', run.cost !== null && run.cost !== undefined ? String(run.cost) : 'not reported'],
                  ['Outcome', outcome],
                ]);
              return table;
            };

            // All models failed (or the answer was empty): skip the PR
            // comment entirely. Any older summary comment is left untouched.
            if (!aiSummary) {
              core.warning('No AI summary produced; skipping the PR comment.');
              await (await writeRunSummary('skipped, no comment')).write();
              return;
            }

            // The title and AI text come from untrusted PR content; break
            // @mentions so a crafted PR can't make the bot ping people.
            const noPing = s => s.replace(/@(?=[\w-])/g, '@\u200b');

            const footer = run.usedModel
              ? `<sub>Generated by \`${run.usedModel}\`${run.usedModel !== models[0] ? ` (fallback from \`${models[0]}\`)` : ''}</sub>`
              : null;

            // A marker so later pushes update this comment instead of adding another.
            const marker = '<!-- pr-summary -->';
            const summary = [
              marker,
              '## 📋 PR Summary',
              '',
              `**Title:** ${noPing(pr.title)}`,
              '',
              `**${pr.changed_files}** files changed`,
              '',
              `### Description\n${noPing(aiSummary)}`,
              footer ? `\n${footer}` : null,
            ].filter(v => v !== null).join('\n');

            // Only reuse comments this workflow wrote; the token can't edit anyone else's.
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: prNumber, per_page: 100,
            });
            const previous = comments.find(c =>
              c.user && c.user.login === 'github-actions[bot]' && c.body && c.body.startsWith(marker));

            let comment;
            if (previous) {
              ({ data: comment } = await github.rest.issues.updateComment({
                owner, repo, comment_id: previous.id, body: summary,
              }));
              core.info(`Updated existing summary comment: ${comment.html_url}`);
            } else {
              ({ data: comment } = await github.rest.issues.createComment({
                owner, repo, issue_number: prNumber, body: summary,
              }));
              core.info(`Posted summary comment: ${comment.html_url}`);
            }

            // Run page summary, so the details are visible without opening the log.
            await (await writeRunSummary(previous ? 'comment updated' : 'comment created'))
              .addLink('View comment', comment.html_url)
              .write();
